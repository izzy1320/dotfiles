[colors]
background = #222222
foreground = #ffffff
disabled = #707880

[bar/main]
width = 100%
height = 24pt
radius = 0

bottom = false
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
padding-left = 0
padding-right = 1
module-margin = 1

font-0 = "monospace:size=10;2"
font-1 = "Font Awesome 6 Free:style=Solid:size=10;2"
font-2 = "Font Awesome 6 Brands:size=10;2"

modules-left = i3
modules-center = clock
modules-right = i3-mode tray pulseaudio bluetooth network cpu memory notifications logout

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/i3]
type = internal/i3
show-urgent = true
index-sort = true
enable-click = true
enable-scroll = false

label-focused = %name%
label-focused-underline = #75f1fa
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-padding = 1

label-visible = %name%
label-visible-padding = 1

label-urgent = %name%
label-urgent-underline = #ff5555
label-urgent-padding = 1

[module/i3-mode]
type = internal/i3
format = <label-mode>
label-mode = %mode%
label-mode-padding = 1
label-mode-foreground = #000
label-mode-background = #75f1fa

[module/clock]
type = internal/date
interval = 1
date = 󰥔 %a, %d. %b %I:%M %p
label = %date%

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume> <bar-volume>
label-volume =  %percentage%%
label-muted = 
click-right = pavucontrol

bar-volume-width = 10
bar-volume-gradient = false
bar-volume-indicator = |
bar-volume-fill = ─
bar-volume-empty = ─

[module/bluetooth]
type = custom/script
exec = bluetoothctl show | grep -q "Powered: yes" && (bluetoothctl info | grep -q "Device" && echo " Connected" || echo " On") || echo ""
interval = 5

[module/network]
type = internal/network
interface = enp12s0
interface-type = wired
interval = 3.0

format-connected = <label-connected>
format-disconnected = <label-disconnected>

label-connected = 󰈀
label-disconnected = 

[module/cpu]
type = internal/cpu
interval = 10
format =  <label>%
label = %percentage:2%%
click-left = kitty -e btop

[module/memory]
type = internal/memory
interval = 30
format =  <label>%
label = %percentage_used%%

[module/tray]
type = internal/tray
tray-spacing = 10px
tray-size = 21px

[module/notifications]
type = custom/script
exec = echo ""
click-left = swaync-client -t -sw
click-right = swaync-client -d -sw

[module/logout]
type = custom/text
label = ⏻
click-left = wlogout
