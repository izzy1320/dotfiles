[colors]
background = #282a36
foreground = #f8f8f2
current-line = #44475a
comment = #6272a4
cyan = #8be9fd
purple = #bd93f9
red = #ff5555
dark-bg = #282a36

[bar/main]
width = 100%
height = 30pt
radius = 0

bottom = false
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 0pt
padding-left = 1
padding-right = 1
module-margin = 1

font-0 = "UbuntuMono Nerd Font Propo:style=Bold:size=12;3"

modules-left = i3
modules-center = clock
modules-right = i3-mode tray pulseaudio bluetooth network cpu memory notifications logout

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/i3]
type = internal/i3
show-urgent = true
index-sort = true
enable-click = true
enable-scroll = false

label-focused = %name%
label-focused-background = ${colors.purple}
label-focused-foreground = ${colors.dark-bg}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-background = transparent
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 1

label-visible = %name%
label-visible-background = transparent
label-visible-foreground = ${colors.foreground}
label-visible-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.foreground}
label-urgent-padding = 1

[module/i3-mode]
type = internal/i3
format = <label-mode>
label-mode = %mode%
label-mode-padding = 1
label-mode-foreground = ${colors.dark-bg}
label-mode-background = ${colors.cyan}

[module/clock]
type = internal/date
interval = 1
date = 󰥔 %a, %d. %b %I:%M %p
label = %date%
format-background = ${colors.current-line}
format-padding = 1

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume> <bar-volume>
format-volume-background = ${colors.current-line}
format-volume-padding = 1

format-muted-background = ${colors.current-line}
format-muted-padding = 1

label-volume =  %percentage%%
label-muted = 

click-right = pavucontrol

bar-volume-width = 8
bar-volume-gradient = false
bar-volume-indicator = 
bar-volume-fill = ─
bar-volume-empty = ─
bar-volume-foreground-0 = ${colors.cyan}
bar-volume-empty-foreground = ${colors.comment}

[module/bluetooth]
type = custom/script
exec = bluetoothctl show | grep -q "Powered: yes" && (bluetoothctl info | grep -q "Device" && echo " Connected" || echo " On") || echo ""
interval = 5
format-background = ${colors.current-line}
format-padding = 1

[module/network]
type = internal/network
interface = enp12s0
interface-type = wired
interval = 3.0

format-connected = <label-connected>
format-connected-background = ${colors.current-line}
format-connected-padding = 1

format-disconnected = <label-disconnected>
format-disconnected-background = ${colors.current-line}
format-disconnected-padding = 1

label-connected = 󰈀
label-disconnected = 

[module/cpu]
type = internal/cpu
interval = 10
format =  <label>%
format-background = ${colors.current-line}
format-padding = 1
label = %percentage:2%%
click-left = kitty -e btop

[module/memory]
type = internal/memory
interval = 30
format =  <label>%
format-background = ${colors.current-line}
format-padding = 1
label = %percentage_used%%

[module/tray]
type = internal/tray
format-background = ${colors.current-line}
format-padding = 1
tray-spacing = 10px
tray-size = 18px

[module/notifications]
type = custom/script
exec = echo ""
format-background = ${colors.current-line}
format-padding = 1
click-left = swaync-client -t -sw
click-right = swaync-client -d -sw

[module/logout]
type = custom/text
label = ⏻
format-background = ${colors.current-line}
format-padding = 1
click-left = wlogout
