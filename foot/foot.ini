# ~/.config/foot/foot.ini

# Font & Layout Settings
font=UbuntuMono Nerd Font:size=16
pad=5x5

[scrollback]
lines=10000
multiplier=3.0
indicator-position=relative

[cursor]
style=block
color=282828 ebdbb2
blink=no

[url]
launch=xdg-open ${url}
label-letters=sadfjkoledw
osc8-underline=always

[colors]
# Foreground / Background
foreground=ebdbb2
background=282828

# Regular Colors
regular0=282828 # black
regular1=cc241d # red
regular2=98971a # green
regular3=d79921 # yellow
regular4=458588 # blue
regular5=b16286 # magenta
regular6=689d6a # cyan
regular7=a89984 # white

# Bright Colors
bright0=928374 # bright black
bright1=fb4934 # bright red
bright2=b8bb26 # bright green
bright3=fabd2f # bright yellow
bright4=83a598 # bright blue
bright5=d3869b # bright magenta
bright6=8ec07c # bright cyan
bright7=ebdbb2 # bright white

# Selection Colors
selection-foreground=282828
selection-background=ebdbb2

[key-bindings]
# Clipboard
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste

# Scrolling
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
scrollback-up-line=Control+Shift+Up
scrollback-down-line=Control+Shift+Down

# Font Resizing
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0

# URLs and Search
show-urls-launch=Control+Shift+u
search-start=Control+Shift+r
