# ~/.config/foot/foot.ini

# Font & Layout Settings
font=UbuntuMono Nerd Font:size=16
pad=5x5

[scrollback]
lines=10000
multiplier=3.0
indicator-position=relative

[cursor]
style=block
color=282a36 f8f8f2
blink=no

[url]
launch=xdg-open ${url}
label-letters=sadfjkoledw
osc8-underline=always

[colors]
# Foreground / Background
foreground=f8f8f2
background=282a36
alpha=0.95

# Regular Colors
regular0=21222c # black
regular1=ff5555 # red
regular2=50fa7b # green
regular3=f1fa8c # yellow
regular4=bd93f9 # blue
regular5=ff79c6 # magenta
regular6=8be9fd # cyan
regular7=f8f8f2 # white

# Bright Colors
bright0=6272a4 # bright black
bright1=ff6e6e # bright red
bright2=69ff94 # bright green
bright3=ffffa5 # bright yellow
bright4=d6acff # bright blue
bright5=ff92d0 # bright magenta
bright6=a4ffff # bright cyan
bright7=ffffff # bright white

# Selection Colors
selection-foreground=f8f8f2
selection-background=44475a

[key-bindings]
# Clipboard
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste

# Scrolling
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
scrollback-up-line=Control+Shift+Up
scrollback-down-line=Control+Shift+Down

# Font Resizing
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0

# URLs and Search
show-urls-launch=Control+Shift+o
search-start=Control+Shift+r
