[[language]]
name = "nix"
auto-format = true
formatter = { command = "nixfmt" }

[language-server.nixd]
command = "nixd"

[language-server.nixd.config.nixpkgs]
expr = "import <nixpkgs> { }"

[language-server.nixd.config.options.nixos]
expr = "(import <nixpkgs/nixos> { configuration = {}; }).options"
